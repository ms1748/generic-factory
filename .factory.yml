# Factory settings for this repo, when the dispatcher serves the factory's own repo as one of its projects
# (FACTORY_PROJECTS). Read by the dispatcher itself (src/config.ts). With `lanes` here, this list replaces the
# built-in one, so every lane is listed. Dashboard switches (on/off, live/dry, Parallel runs) still win
# over this file, and every lane stays dry until the owner switches it on there.
#
# Hourly build lanes, maintainer twice a day, security weekly, the built-in reviewer on every ready
# factory PR. No ideas lane: this repo has no ideas.md.
timezone: America/New_York
# No cap on open factory PRs (0 = no limit).
max_open_prs: 0
lanes:
  - name: builder
    kind: builder
    model: opus
    sizes: [M, L, none]
    splits: [XL]
    schedule: ["00:00", "01:00", "02:00", "03:00", "04:00", "05:00", "06:00", "07:00", "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"]
  - name: small-builder
    kind: builder
    model: sonnet
    sizes: [S]
    schedule: ["00:30", "01:30", "02:30", "03:30", "04:30", "05:30", "06:30", "07:30", "08:30", "09:30", "10:30", "11:30", "12:30", "13:30", "14:30", "15:30", "16:30", "17:30", "18:30", "19:30", "20:30", "21:30", "22:30", "23:30"]
  - name: maintainer
    kind: maintainer
    model: opus
    schedule: ["08:00", "17:00"]
  - name: security
    kind: security
    model: sonnet
    schedule: ["thu 08:00"]
  - name: reviewer
    kind: reviewer
    model: sonnet
    prompt: "factory:reviewer"

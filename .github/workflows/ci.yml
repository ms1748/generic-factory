# Checks for every PR and for main: tests, type check and the dashboard build, in the repo and in the
# public copy scripts/publish-snapshot.sh makes.
# Runs on GitHub's machines (ubuntu-latest) by default, which are free for a public repo. The repository
# variable LINUX_ON_HOMELAB `true` moves the job to the owner's homelab Linux runner (labels self-hosted,
# linux, homelab: Proxmox LXC 111), for a private copy where hosted runners are refused.
# Pull requests from forks never run on the self-hosted runner, whatever the variable says: a fork's PR
# carries code anyone can write, and running it on a persistent machine on the owner's network would hand
# that machine to them. Those PRs fall back to ubuntu-latest (or wait, if hosted runners are refused).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, types and web build
    runs-on: ${{ vars.LINUX_ON_HOMELAB == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","homelab"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build:web

  # The public copy: scripts/publish-snapshot.sh leaves some paths out, so make the copy here and run the
  # same checks inside it. A test, import or build step that still needs a left-out file fails this job.
  # CI has no private-values file, so it uses a random one (it can't be a fixed string: that would match this
  # file). Checking the owner's real values stays a local step before publishing.
  snapshot:
    name: Public snapshot builds and passes
    runs-on: ${{ vars.LINUX_ON_HOMELAB == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","homelab"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      GIT_AUTHOR_NAME: Factory snapshot
      GIT_AUTHOR_EMAIL: snapshot@example.com
      GIT_COMMITTER_NAME: Factory snapshot
      GIT_COMMITTER_EMAIL: snapshot@example.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Make the public copy
        run: |
          od -An -N16 -tx1 /dev/urandom | tr -d ' \n' > scripts/private-values.txt
          scripts/publish-snapshot.sh "$RUNNER_TEMP/snapshot"
      - name: Install in the copy
        working-directory: ${{ runner.temp }}/snapshot
        run: npm ci
      - name: Tests in the copy
        working-directory: ${{ runner.temp }}/snapshot
        run: npm test
      - name: Types in the copy
        working-directory: ${{ runner.temp }}/snapshot
        run: npm run check
      - name: Web build in the copy
        working-directory: ${{ runner.temp }}/snapshot
        run: npm run build:web
